# 要件とテストの突合検査と、層の依存の契約の検査と、テストを自動で走らせる。
# 段は上から順に走り、落ちたところで止まる。突合検査を pytest より先に置くのは、
# 要件に対応するテストが無いことを、テストが落ちることより先に知るためである。
# 層の依存の契約の段は、コードの読み込みが .importlinter に書いた向きどおりか、
# src/accord/ の直下に層に載っていない置き場ができていないかを見る。
# 置き場の検査の段は、層の中の入れ子の置き場、生成器が accord を読まないこと、
# 設定を読むモジュールが標準ライブラリと同じ層の中だけを読むことを見る。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 中身を読むだけ。書き込みの権限は渡さない。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: uv を用意する
        # この部品はメジャー版の札（v10 の形）を出していないので、公式の案内どおり
        # コミットの識別子で固定し、版をコメントで添える。
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # 動く下限の版で走らせる（「3.12 以上で動く」という宣言どおりかを毎回見る）。
          python-version: "3.12"

      - name: 依存を入れる
        run: uv sync

      - name: 突合検査そのものを試す
        run: uv run python tools/check_req_coverage_selftest.py

      - name: 要件とテストを突き合わせる
        run: uv run python tools/check_req_coverage.py

      - name: 層の依存が契約どおりかを見る
        run: uv run lint-imports

      - name: 置き場の検査そのものを試す
        run: uv run python tools/check_structure_selftest.py

      - name: 置き場と定義を見る
        # 設計文書はこのリポジトリの外にあるので、ここでは渡さない。
        # 渡さないと、実装層の表を見る項目だけが省略になる（残りの 4 項目は走る）。
        run: uv run python tools/check_structure.py

      - name: テストを走らせる
        run: uv run pytest
