# accord の設定の見本。
#
# 正本の置き場と、固有の語彙（媒体の名前、機能の分類の節、パッケージの仮説の状態の語）を
# ここに書く。コードにはこれらの値を直書きしない。別の人が使うときは、このファイルを
# 自分の語彙で書き換え、起動時に `accord --config <このファイル>` で指す。
#
# この見本が指す正本は、すべて架空の人物と架空の案件でできている。

[source]
# 正本のディレクトリ。この設定ファイルから見た相対の場所で書く。
directory = "source"

[source.files]
# 正本 8 種のファイル名。提示物だけはディレクトリで、媒体ごとの下位ディレクトリを持つ。
positioning = "positioning.md"
packages = "packages.md"
capabilities = "capabilities.md"
career = "career.md"
engagements = "engagements.md"
resume_ledger = "resume_ledger.md"
presentations = "presentations"

# 公開記録（リポジトリ・登壇・記事・書籍・第三者の掲載）の置き場。
# この 1 行だけは、書かなくてもよい。書かなければ公開記録を 0 件として読み、提示物の本文の
# URL を正本と突き合わせる検査も行わない（行っていないことは、検査の断りに 1 行出る）。
public_records = "public_records.md"

# 見せ方の正本。媒体ごとの規約と、禁じた言い回しを持つ。accord はこの中身を型として持たず、
# 材料の取り出しが、宛先の媒体の節と「禁じた言い回し」の節をそのまま材料に載せる。
presentation_rules = "presentation_rules.md"

[vocabulary]
# 媒体の名前。決めの適用範囲と、提示物の宛先に使う。
channels = ["tsukikusa", "nagiho"]

# 機能の台帳の節の名前。機能を登記するときの分類は、この一覧の語に限る。
capability_categories = [
    "データの置き場をつくる",
    "数字を読める形にする",
    "決めて、進める",
    "引き継げる形にする",
    "人と体制をつくる",
]

# パッケージの仮説の状態の語。
package_hypothesis_states = ["仮説のみ", "検証中", "実績あり"]

# 公開記録の種類の語。公開記録を登記するときの種類は、この一覧の語に限る。
# 公開記録の置き場を書いたときだけ必須になる（置き場を書かない設定では、この 2 行も要らない）。
public_record_kinds = ["リポジトリ", "登壇", "記事", "書籍", "第三者の掲載"]

# 公開記録の役割の語。その公開記録で自分が何だったかを書く。
public_record_roles = ["登壇者", "著者", "作者", "掲載対象"]
