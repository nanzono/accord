# accord の型・関係・制約の正本。
#
# この 1 ファイルが正本で、Pydantic のモデル（models/types.py）と制約の宣言
# （models/constraints.py）は scripts/generate_models.py がここから生成する。
# 生成物を手で直してはいけない。直すのはこのファイルで、直したら生成器を回す。
#
# 型・関係・制約の数はこのファイルが正本で（由来は README の「設計の要点」）、
# 生成物と README はこのファイルの項目に 1 対 1 で対応する。
# 資源 accord://ontology はこのファイルの中身を返す。
#
# 指される側の 5 つの型（職歴の枠・受託案件・公開記録・機能・パッケージ）は、欄 id を持つ。
# 正本どうしの結びはこの id で書き、見出しや名前は人が読む表示名として残る。
# 見出しを書き換えても参照が切れないこと、区切りを間違えた値を機械が断定できることが、
# 文字列の写しではなく id で結ぶ理由である。

version: 1

# ---------------------------------------------------------------- 型（8）
#
# field の type に書ける値は 5 つ。
#   text        文字列 1 つ            -> str
#   date        日付                   -> datetime.date
#   text_list   文字列の一覧           -> list[str]
#   mapping     名前と値の組の一覧     -> list[dict[str, str]]
#   flag        真偽                   -> bool
# required: true の欄は生成したモデルで必須になる。

types:
  - name: Positioning
    label: 売り方の決め
    description: どのパッケージを前面に出すかの判断。1 決め 1 ブロックで積み、過去のブロックは書き換えない。
    source: positioning
    fields:
      - name: decided_on
        label: 日付
        type: date
        required: true
        description: この決めを決めた日。パッケージ定義の鮮度は、この日付と比べて判定する。
      - name: scope
        label: 適用範囲
        type: text
        required: true
        description: 媒体の名前か「全体」。媒体の名前は設定ファイルの一覧から取る。
      - name: headline_package
        label: 前面に出す束
        type: text
        required: true
        description: 看板にするパッケージの ID。パッケージ定義に実在する ID に限る。
      - name: rationale
        label: 根拠
        type: text
        required: true
        description: なぜこの束を前面に出すのかの説明。
      - name: exceptions
        label: 例外
        type: mapping
        required: false
        description: この決めに反してよい提示物の名前と、その理由の組。宣言の一致の検査はここに書いた提示物を飛ばす。

  - name: Package
    label: パッケージ
    description: 機能を束ねて誰に売るかを定めた売り物の単位。
    source: packages
    fields:
      - name: id
        label: ID
        type: text
        required: true
        description: このパッケージを指すときに使う識別子。英小文字・数字・ハイフンで 3〜40 字、先頭と末尾は英数字、正本全体で重ならない値にする。
      - name: name
        label: パッケージ名
        type: text
        required: true
        description: 人が読む表示名。決めと提示物が指すときは名前ではなく ID を使う。
      - name: buyer
        label: 想定買い手
        type: text
        required: true
        description: 誰に売るか。
      - name: hypothesis_state
        label: 仮説の状態
        type: text
        required: true
        description: 選べる語は設定ファイルの package_hypothesis_states が持つ一覧に限る。
      - name: capabilities
        label: 束ねる機能
        type: text_list
        required: true
        description: 束ねる機能の ID。機能の台帳にある ID に限る。複数あるときは半角のスラッシュ「/」で区切る（例「id-a / id-b」）。ID にスラッシュは入らないので、区切りと値を取り違えない。
      - name: updated_on
        label: 最終更新
        type: date
        required: true
        description: この定義を最後に直した日。決めの日付より古いと鮮度の違反になる。
      - name: basis
        label: 判定根拠
        type: text
        required: false
        description: 仮説の状態をそう判定した理由。
      - name: source
        label: 出典
        type: text
        required: false
        description: 判定の元にした正本の節。
      - name: breaks_when
        label: 崩れる条件
        type: text
        required: false
        description: この束が売り物として成り立たなくなる条件。

  - name: Capability
    label: 機能
    description: 提供できる仕事 1 つ。裏づけの節を持つ。
    source: capabilities
    fields:
      - name: id
        label: ID
        type: text
        required: true
        description: この機能を指すときに使う識別子。英小文字・数字・ハイフンで 3〜40 字、先頭と末尾は英数字、正本全体で重ならない値にする。台帳の表では 1 列目に置く。
      - name: name
        label: 機能名
        type: text
        required: true
        description: 人が読む表示名。パッケージが束ねるときは名前ではなく ID を使う。
      - name: description
        label: 説明
        type: text
        required: true
        description: その仕事が何をするかの 1 行。
      - name: category
        label: 分類
        type: text
        required: true
        description: 機能の台帳の節の名前。選べる語は設定ファイルから読む。
      - name: evidence_sections
        label: 裏づけの節
        type: text_list
        required: true
        description: 職歴の枠か受託案件か公開記録の ID。1 つ以上。複数あるときは半角のスラッシュ「/」で区切る（例「id-a / id-b」）。ほかの記号でつなぐと、つないだ全体が 1 つの値として読まれ、ID の形式に合わないと判定される。実在する ID に限る。

  - name: CareerFrame
    label: 職歴の枠
    description: 会社 1 社ぶん、またはフリーランス 1 期ぶんの職歴。
    source: career
    fields:
      - name: id
        label: ID
        type: text
        required: true
        description: この枠を指すときに使う識別子。英小文字・数字・ハイフンで 3〜40 字、先頭と末尾は英数字、正本全体で重ならない値にする。
      - name: heading
        label: 見出し
        type: text
        required: true
        description: 節の見出し。人が読む表示名で、指すときは見出しではなく ID を使う（見出しは自由に書き換えてよい）。
      - name: period
        label: 期間
        type: text
        required: true
      - name: organization
        label: 所属
        type: text
        required: true
      - name: position
        label: 立場
        type: text
        required: true
      - name: summary
        label: やったこと
        type: text
        required: false
      - name: outcome
        label: 成果
        type: text
        required: false
      - name: technologies
        label: 技術
        type: text
        required: false
      - name: disclosure
        label: 公開可否
        type: text
        required: true
        description: 外に出してよいかどうか。公開不可の節は材料の取り出しが落とす。
      - name: source
        label: 出所
        type: text
        required: true
        description: この記述の元にした素材。

  - name: Engagement
    label: 受託案件
    description: クライアント 1 社ぶんの仕事、または横断のトピック。
    source: engagements
    fields:
      - name: id
        label: ID
        type: text
        required: true
        description: この案件を指すときに使う識別子。英小文字・数字・ハイフンで 3〜40 字、先頭と末尾は英数字、正本全体で重ならない値にする。
      - name: heading
        label: 見出し
        type: text
        required: true
        description: 節の見出し。人が読む表示名で、指すときは見出しではなく ID を使う（見出しは自由に書き換えてよい）。
      - name: industry
        label: 業種
        type: text
        required: false
      - name: scale
        label: 規模
        type: text
        required: false
      - name: problem
        label: 課題
        type: text
        required: false
      - name: actions
        label: やったこと
        type: text
        required: false
      - name: outcome
        label: 成果
        type: text
        required: false
      - name: technologies
        label: 技術
        type: text
        required: false
      - name: disclosure
        label: 公開可否
        type: text
        required: true
        description: 外に出してよいかどうか。公開不可の節は材料の取り出しが落とす。
      - name: source
        label: 出所
        type: text
        required: true
        description: この記述の元にした素材。

  - name: PublicRecord
    label: 公開記録
    description: 外から確かめられる公開の成果物 1 件。リポジトリ・登壇・記事・書籍・第三者の掲載など。1 件 1 ブロックで積む。
    source: public_records
    fields:
      - name: id
        label: ID
        type: text
        required: true
        description: この 1 件を指すときに使う識別子。英小文字・数字・ハイフンで 3〜40 字、先頭と末尾は英数字、正本全体で重ならない値にする。
      - name: name
        label: 名前
        type: text
        required: true
        description: この 1 件を言い表す、人が読む表示名。機能の裏づけが指すときは名前ではなく ID を使う。
      - name: kind
        label: 種類
        type: text
        required: true
        description: 選べる語は設定ファイルの public_record_kinds が持つ一覧に限る。
      - name: published_on
        label: 日付
        type: text
        required: true
        description: 2020-03-10 の形。月までしか分からないときは 2020-03、年だけなら 2020 と書く。
      - name: url
        label: URL
        type: text
        required: false
        description: 外から確かめられる場所。紙媒体など URL が無いものは「なし」と書く。
      - name: publisher
        label: 発行元か主催
        type: text
        required: true
        description: 記事なら載せた媒体、登壇なら催しの主催、リポジトリなら置いた場所。
      - name: role
        label: 役割
        type: text
        required: true
        description: 選べる語は設定ファイルの public_record_roles が持つ一覧に限る。
      - name: origin_section
        label: 由来の節
        type: text
        required: false
        description: 職歴の枠か受託案件の ID。無ければ空でよい。
      - name: source
        label: 出所
        type: text
        required: false
        description: この記述の元にした素材。URL があれば、その URL 自身が外から確かめられる出所になる。

  - name: Presentation
    label: 提示物
    description: 媒体の画面や添付に貼る文面。どのパッケージを名乗るかを宣言する。
    source: presentations
    fields:
      - name: path
        label: ファイル
        type: text
        required: true
        description: 正本のディレクトリからの相対パス。違反の一覧はこの名前で場所を指す。
      - name: channel
        label: 宛先の媒体
        type: text
        required: true
        description: 媒体の名前。設定ファイルの一覧から取る。
      - name: declared_package
        label: 宣言する束
        type: text
        required: true
        description: この文面が名乗っているパッケージの ID。
      - name: pending_notes
        label: 未反映の注記
        type: text_list
        required: false
        description: まだ正本に反映していない事実の覚え書き。「受託案件の ID — 覚え書き」の形で書き、区切りより前がその事実の入る先の節の ID になる。指す ID が実在することを検査する。
      - name: created_on
        label: 作成日
        type: date
        required: false

  - name: ResumeLedger
    label: 職務経歴書の台帳
    description: 職務経歴書の元になる正本の、案件 1 件ぶんのブロック。台帳全体はこのブロックの並びで持つ。
    source: resume_ledger
    fields:
      - name: entry_number
        label: 案件番号
        type: text
        required: true
        description: 台帳の中での通し番号。違反の一覧はこの番号で場所を指す。
      - name: heading
        label: 見出し
        type: text
        required: true
      - name: period
        label: 期間
        type: text
        required: true
      - name: scale
        label: 規模
        type: text
        required: true
      - name: process
        label: 担当工程
        type: text
        required: true
      - name: role
        label: 役割と任され方
        type: text
        required: true
      - name: decisions
        label: 自分が決めたこと
        type: text
        required: true
      - name: closing
        label: 終わりの状態
        type: text
        required: true
      - name: source_section
        label: 出典の節
        type: text
        required: true
        description: 写し元の節の ID（受託案件）。実在と公開可否を検査する。
      - name: fold_line
        label: 畳み行
        type: text
        required: false

# ---------------------------------------------------------------- 関係（8 種・辺 11 本）
#
# 裏づけが相手の型を 3 つ、由来が 2 つ持つので、種は 8、辺は 11 本になる。

relations:
  - name: 前面に出す
    from: Positioning
    to: [Package]
    cardinality: 決め 1 件につきパッケージ 1 つ
    description: 決めが、その時点で看板にするパッケージを 1 つ指す。

  - name: 束ねる
    from: Package
    to: [Capability]
    cardinality: パッケージ 1 つにつき機能 1 つ以上
    description: パッケージが、売り物として束ねる機能を指す。

  - name: 裏づけ
    from: Capability
    to: [CareerFrame, Engagement, PublicRecord]
    cardinality: 機能 1 つにつき節 1 つ以上
    description: 機能が、その仕事をしたと言える事実の節か、外から確かめられる公開記録を指す。相手の型ごとに 1 本ずつ数えるので辺は 3 本。

  - name: 由来
    from: PublicRecord
    to: [CareerFrame, Engagement]
    cardinality: 公開記録 1 件につき節 0 か 1
    description: 公開記録が、その中身の元になった仕事の節を指す。公開記録どうしは指し合わない。

  - name: 宣言する
    from: Presentation
    to: [Package]
    cardinality: 提示物 1 件につきパッケージ 1 つ
    description: 外に出す文面が、名乗っているパッケージを指す。

  - name: 未反映の注記
    from: Presentation
    to: [Engagement]
    cardinality: 提示物 1 件につき注記 0 件以上
    description: 文面に書いたが正本にまだ反映していない事実が、どの節に入るはずかを指す。

  - name: 載せる
    from: Presentation
    to: [PublicRecord]
    cardinality: 提示物 1 件につき公開記録 0 件以上
    description: 外に出す文面の本文に貼った URL が、正本に登記した公開記録を指す。

  - name: 出典の節
    from: ResumeLedger
    to: [Engagement]
    cardinality: 台帳の案件 1 件につき節 1 つ
    description: 台帳の案件が、どの受託案件の節から写したかを指す。

# ---------------------------------------------------------------- 制約（12）
#
# appears_as は、この制約がどの顔で現れるか。
#   拒否  書きの操作が入力を受け付けず、代わりの手を返す
#   検出  検査の操作が違反の一覧に挙げる（読みの操作では警告になる）
#   構造  実行時ではなく、モジュールの分け方と正本の書き方で守る
# enforced_by に書いた操作の名前で、サービスの実装がこの制約を参照する。

constraints:
  - name: 決めの必須欄
    watches: 売り方の決めに、日付・適用範囲・前面に出す束・根拠の 4 欄が揃っているか。
    enforced_by: [record_positioning]
    appears_as: 拒否
    next_action: 欠けた欄の名前と、その欄の書き方の例を返す。

  - name: パッケージ定義の鮮度
    watches: パッケージ定義の最終更新が、適用される決めの日付より古くないか。
    enforced_by: [record_positioning, check_consistency]
    appears_as: 検出
    next_action: 定義ファイルの名前と、決めの日付と最終更新日の両方を返す。

  - name: 提示物の宣言と看板の一致
    watches: 提示物が宣言する束が、適用される決めの前面に出す束と一致するか。決めの例外欄に書いた提示物は見ない。
    enforced_by: [record_positioning, check_consistency]
    appears_as: 検出
    next_action: 提示物のファイル名と、いまの看板のパッケージ名を返す。

  - name: ID の形式
    watches: 指される側の 5 つの型（職歴の枠・受託案件・公開記録・機能・パッケージ）の項目が自分に付ける ID が、英小文字・数字・ハイフンで 3〜40 字・先頭と末尾は英数字の形に合うか。
    enforced_by: [check_consistency, register_capability, revise_package, register_public_record]
    appears_as: 拒否
    next_action: 形式に合わない ID の直し方を返す。

  - name: ID の一意性
    watches: 指される側の 5 つの型の項目が自分に付ける ID が、正本全体で 2 つ以上の項目に付いていないか。形に合わない ID は、形を直すまで重なりを見ない。
    enforced_by: [check_consistency, register_capability, revise_package, register_public_record]
    appears_as: 拒否
    next_action: 同じ ID を持つ場所を両方返す。

  - name: 裏づけ節名の実在
    watches: 機能の裏づけに書いた ID が、職歴の枠・受託案件・公開記録の ID として実在するか。
    enforced_by: [register_capability, check_consistency]
    appears_as: 拒否
    next_action: 実在する ID のうち近いものを候補として返し、文に表示名を添える。

  - name: 束ねる機能名の一致
    watches: パッケージが束ねる機能の ID が、機能の台帳にあるか。
    enforced_by: [revise_package, check_consistency]
    appears_as: 拒否
    next_action: 近い機能の ID の候補と、先に register_capability を呼ぶことを返す。

  - name: 注記と出典の節の実在
    watches: 提示物の未反映の注記が指す ID と、職務経歴書の台帳の出典の節の ID が、受託案件の ID として実在するか。
    enforced_by: [check_consistency]
    appears_as: 検出
    next_action: 実在する受託案件の ID の候補を返す。

  - name: 出典と裏づけの節の公開可否
    watches: 職務経歴書の台帳の出典の節と、機能の裏づけの節が、公開可の節か。未反映の注記が指す節は見ない。
    enforced_by: [check_consistency, assemble_material, register_capability]
    appears_as: 検出
    next_action: 公開可の節の ID の候補を返す。材料からは公開不可の節を落とし、落とした節の名前を警告に書く。

  - name: 公開記録の必須欄
    watches: 公開記録に、ID・名前・種類・日付・発行元か主催・役割の 6 欄が揃っているか。
    enforced_by: [register_public_record]
    appears_as: 拒否
    next_action: 欠けた欄の名前と、その欄の書き方の例を返す。

  - name: 公開記録の種類の語彙
    watches: 公開記録の種類が、設定ファイルが持つ種類の語の一覧にあるか。
    enforced_by: [register_public_record, check_consistency]
    appears_as: 拒否
    next_action: 設定が持つ種類の語の一覧を返す。

  - name: 公開記録の役割の語彙
    watches: 公開記録の役割が、設定ファイルが持つ役割の語の一覧にあるか。
    enforced_by: [register_public_record, check_consistency]
    appears_as: 拒否
    next_action: 設定が持つ役割の語の一覧を返す。

  - name: 機能の分類の語彙
    watches: 機能の分類（機能の台帳の節の見出し）が、設定ファイルが持つ分類の語の一覧にあるか。
    enforced_by: [register_capability, check_consistency]
    appears_as: 拒否
    next_action: 設定が持つ分類の語の一覧を返す。

  - name: 由来の節の実在
    watches: 公開記録の由来の節に書いた ID が、職歴の枠か受託案件の ID として実在するか。
    enforced_by: [register_public_record, check_consistency]
    appears_as: 拒否
    next_action: 実在する ID のうち近いものを候補として返し、文に表示名を添える。

  - name: 提示物の URL と公開記録の一致
    watches: 提示物の本文に貼った URL が、正本の公開記録の URL にあるか。経路の書き方だけが違うものも見る。
    enforced_by: [check_consistency]
    appears_as: 検出
